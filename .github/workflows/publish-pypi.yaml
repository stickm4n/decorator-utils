name: Publish PyPI

on:
  release:
    types: [ published ]

jobs:
  publish-pypi:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "~=0.12.0"

      - name: Build
        run: uv build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: false
          skip-existing: true
